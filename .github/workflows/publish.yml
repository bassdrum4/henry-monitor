name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Publishes mutate release assets; serialize runs and never cancel mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android build tools the app needs
        run: bash scripts/install-android-prereqs.sh
        shell: bash

      - name: Restore the Android signing key
        shell: bash
        env:
          HM_KEYSTORE_B64: ${{ secrets.HM_KEYSTORE_B64 }}
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${HM_KEYSTORE_B64:-}" || -z "${HM_KEYSTORE_PASSWORD:-}" ]]; then
            echo "Repository secrets HM_KEYSTORE_B64 and HM_KEYSTORE_PASSWORD are not configured." >&2
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$HM_KEYSTORE_B64" | base64 -d > signing/henry-monitor.keystore
          printf '%s' "$HM_KEYSTORE_PASSWORD" > signing/password.txt

      - name: Build, test, and publish the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ github.event_name == 'push' && format('Automated release of {0}, built from the pushed source.', github.ref_name) || 'Manual workflow release.' }}
        run: bash scripts/publish-update.sh

      - name: Upload checksums as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
